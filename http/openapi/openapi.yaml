openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
servers:
  - url: http://localhost
paths:
  /notes:
    post:
      summary: Create a note
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    get:
      summary: List all notes
      operationId: listNotes
      responses:
        "200":
          description: All notes in the store, in creation order
          content:
            application/json:
              schema:
                type: object
                required:
                  - notes
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    put:
      summary: Update a note
      description: |
        Updates the given fields of the note. Fields omitted from the
        request body are left unchanged.
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: The updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      summary: Delete a note
      operationId: deleteNote
      responses:
        "204":
          description: Note deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  parameters:
    NoteId:
      name: noteId
      in: path
      required: true
      description: Id of the note
      schema:
        type: string

  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Note:
      type: object
      required:
        - id
        - title
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NoteInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        content:
          type: string
          default: ""

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
